[project]
name = "napari-eia"
version = "0.1.0"
description = "ImageJ Workflow Reproduction in Napari"
readme = "README.md"
authors = [
    { name = "Amir Fathi", email = "fathi0amir@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bioio>=3.7.1",
    "bioio-bioformats>=2.0.0",
    "bioio-tifffile>=1.3.1",
    "datashader>=0.19.1",
    "fastparquet>=2026.9.0",
    "h5py>=3.16.0",
    "holoviews>=1.23.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "napari-animation>=0.0.10",
    "napari-bioformats>=0.3.0.post0",
    "napari-matplotlib>=3.0.2",
    "napari-plot>=0.4.0",
    "napari-roi-manager>=0.0.6",
    "napari-skimage>=0.7.3",
    "napari[optional,pyqt6]>=0.10.0",
    "nbstripout>=0.9.1",
    "numba>=0.62.1",
    "pims>=0.7",
    "rich>=15.0.0",
    "scikit-image>=0.26.0",
    "tifffile>=2026.11.12",
    "tqdm>=4.70.1",
]

[project.scripts]
napari-eia = "napari_eia:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
